name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: outlaw.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: outlaw
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # Only the command-line program. Building the whole workspace here would
      # drag in the desktop app, which needs a system webview that this job has
      # no reason to install -- it packages one binary. The desktop bundles are
      # built by the job below.
      - name: Build
        run: cargo build --release -p ork-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          staging="outlaw-${version}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$staging/"
          cp README.md LICENSE "$staging/"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "${staging}.zip" "$staging"
          else
            tar czf "${staging}.tar.gz" "$staging"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.zip
            *.tar.gz


  desktop:
    name: desktop bundle ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A desktop bundle that fails to build must not take the command-line
    # release down with it. The binaries and their checksums still publish.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The webview the desktop app draws into is a system library on Linux,
      # so it has to be present at build time. Windows ships one already.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build the desktop app
        working-directory: apps/desktop
        run: |
          npm ci
          npm run tauri build
      # Renamed on the way out. Tauri names bundles after the product, which
      # has spaces in it, and GitHub silently rewrites spaces to dots when it
      # publishes an asset -- so the name in SHA256SUMS would not be the name
      # anyone can download, and the installer would ask for a file that does
      # not exist. Deterministic, space-free names avoid the whole question.
      - name: Collect the bundles
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          mkdir -p desktop-artifacts
          find target/release/bundle -type f -regex '.*\.\(msi\|exe\|AppImage\|deb\)$' -exec cp {} desktop-artifacts/ ';'
          for path in desktop-artifacts/*; do
            case "$path" in
              *setup.exe) name="outlaw-repair-kit-${version}-x64-setup.exe" ;;
              *.msi)      name="outlaw-repair-kit-${version}-x64.msi" ;;
              *.AppImage) name="outlaw-repair-kit-${version}-amd64.AppImage" ;;
              *.deb)      name="outlaw-repair-kit-${version}-amd64.deb" ;;
              # Anything else the bundler produced is not something this
              # release publishes. Dropped rather than shipped under a name
              # nobody predicted -- SHA256SUMS and the download link have to
              # agree, always.
              *) rm -f "$path"; continue ;;
            esac
            [ "$path" = "desktop-artifacts/$name" ] || mv "$path" "desktop-artifacts/$name"
          done
          ls -la desktop-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: desktop-artifacts/*

  publish:
    needs: [build, desktop]
    # `always()` so that a skipped or failed desktop bundle does not cancel
    # the release; the guard keeps it from publishing without the binaries.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts
      # The installers refuse to install anything whose checksum does not match
      # this file, so it has to be published alongside the assets it covers.
      - name: Write checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          draft: false
          generate_release_notes: true
          files: artifacts/*
