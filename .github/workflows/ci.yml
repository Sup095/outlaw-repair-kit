name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both supported platforms are built and tested on every change.
        # A change that only works on one of them is a broken change.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Two workspace members draw windows, and on Linux both need
      # development packages that Windows ships as part of the system.
      #
      # The desktop app draws into the system webview, hence webkit2gtk. The
      # installer deliberately does not -- it carries its own drawing, so that
      # it has no prerequisite on the machine somebody is trying to set up --
      # which means OpenGL and the windowing libraries instead.
      #
      # Without these, every Linux run fails on crates that have nothing wrong
      # with them.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf             libgl1-mesa-dev libxkbcommon-dev libwayland-dev             libx11-dev libxrandr-dev libxi-dev libxcursor-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features
      - name: Test
        run: cargo test --all-features
      - name: Smoke-test the binary
        run: cargo run --bin outlaw -- host --json
      # The start-up self-test is the tool checking itself. If it cannot pass
      # on a clean machine, something is wrong with the build, not the machine.
      - name: Smoke-test start-up
        run: cargo run --bin outlaw -- boot

  window:
    name: desktop window
    runs-on: ubuntu-latest
    # Type-checking the window needs no webview and no Rust, so it is its own
    # job: a mistake in the front-end should be reported in seconds rather than
    # waiting behind a full workspace build. Before this existed the only thing
    # that checked these files was the release build, which is much too late to
    # find out.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Check the window
        working-directory: apps/desktop
        run: |
          npm ci
          npm run check
