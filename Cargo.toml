[workspace]
resolver = "3"
members = ["crates/ork-core", "crates/ork-ai", "crates/ork-fix", "crates/ork-boot", "crates/ork-link", "crates/ork-cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Sup095/outlaw-repair-kit"
authors = ["Outlaw Systems"]

[workspace.dependencies]
ork-core = { path = "crates/ork-core" }
ork-ai = { path = "crates/ork-ai" }
ork-fix = { path = "crates/ork-fix" }
ork-boot = { path = "crates/ork-boot" }
ork-link = { path = "crates/ork-link" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "signal"] }
tokio-util = "0.7"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
toml = "1"
dirs = "6"
# rustls with bundled roots rather than native-tls: a diagnostic tool people
# download and run should not depend on whichever OpenSSL happens to be
# installed, nor on the system certificate store being populated.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
    "webpki-roots",
    "http2",
] }
sysinfo = "0.33"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }

[profile.release]
lto = "thin"
strip = true
