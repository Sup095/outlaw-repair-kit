[workspace]
resolver = "3"
members = ["crates/ork-core", "crates/ork-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Sup095/outlaw-repair-kit"
authors = ["Outlaw Programming"]

[workspace.dependencies]
ork-core = { path = "crates/ork-core" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "signal"] }
tokio-util = "0.7"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
sysinfo = "0.33"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }

[profile.release]
lto = "thin"
strip = true
