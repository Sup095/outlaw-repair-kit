# The runbook library that ships with the Outlaw Repair Kit.
#
# Every entry answers a finding the deterministic probes actually produce, so
# the common problems never need a model at all. Entries are conservative on
# purpose: a wrong runbook is worse than no runbook, because it sends someone
# confidently in the wrong direction.
#
# To add your own, drop a .toml file with the same shape into the runbooks
# directory beside your configuration file. An entry with an id matching one
# here replaces it.

[[entry]]
id = "storage.volume-low-on-space"
title = "A drive is running out of space"
finding_ids = ["storage.volume-low-on-space"]
explanation = """
A drive that fills up causes symptoms that look nothing like a storage problem: \
programs fail to start, updates break part-way through, and the system stops \
being able to write its own logs. Reclaiming space is usually easy; the useful \
part is finding out what took it."""

[[entry.fixes]]
description = "Find what is actually using the space before deleting anything, so you remove the cause rather than a symptom."
invasiveness = "inspect"
command = "du -h -d 2 / 2>/dev/null | sort -h | tail -40"
platforms = ["linux"]

[[entry.fixes]]
description = "Open Storage Settings to see the breakdown by category."
invasiveness = "inspect"
command = "start ms-settings:storagesense"
platforms = ["windows"]

[[entry.fixes]]
description = "Clear the package manager's download cache, which is safe to remove and is often several gigabytes."
invasiveness = "low"
command = "pacman -Sc"
platforms = ["linux"]

[[entry.fixes]]
description = "Run Disk Cleanup against system files, including old Windows Update files."
invasiveness = "low"
command = "cleanmgr /sagerun:1"
platforms = ["windows"]

[[entry.fixes]]
description = "Remove old journal logs, keeping the most recent week."
invasiveness = "low"
command = "journalctl --vacuum-time=7d"
platforms = ["linux"]

[[entry]]
id = "memory.high-pressure"
title = "The machine is short of memory"
finding_ids = ["memory.high-pressure"]
explanation = """
Being briefly short of memory is normal under load. Being short of memory while \
also swapping heavily is what makes an entire machine feel frozen, because every \
program is waiting on the disk rather than one program being slow. The important \
question is whether something is leaking or the workload is simply large."""

[[entry.fixes]]
description = "Identify the largest consumers, and whether their memory use grows without bound over time."
invasiveness = "inspect"

[[entry.fixes]]
description = "Close or restart the largest consumer and see whether pressure returns. If it returns steadily, that program is leaking."
invasiveness = "low"

[[entry.fixes]]
description = "If this happens under normal use rather than a heavy job, add swap space so the kernel has somewhere to fall back to instead of killing processes."
invasiveness = "medium"
platforms = ["linux"]

[[entry]]
id = "process.zombie-buildup"
title = "Finished processes are not being cleaned up"
finding_ids = ["process.zombie-buildup"]
explanation = """
These processes have already exited; what remains is an entry in the process \
table that the parent program never collected. They use no memory or CPU, but \
they occupy a finite resource, and a program leaking them steadily will \
eventually stop the machine from starting anything new."""

[[entry.fixes]]
description = "Restart the parent program named in the finding. That clears every zombie it is holding."
invasiveness = "low"

[[entry.fixes]]
description = "If they return, the parent has a bug worth reporting upstream. Restarting the machine clears them in the meantime."
invasiveness = "medium"

[[entry]]
id = "device.driver-mismatch"
title = "A driver no longer matches the system it is loaded into"
finding_ids = ["device.driver-mismatch"]
explanation = """
This is the fault behind a great many "it worked until I updated" reports. The \
driver and the system it plugs into have to agree on a version. When they stop \
agreeing -- usually because an update replaced one half while the other was \
still running -- the machine keeps working until something needs that driver, \
and then behaves inexplicably. A restart resolves the common case, because it \
loads both halves fresh from what is currently installed."""

[[entry.fixes]]
description = "Restart the machine. This resolves the majority of version mismatches, because both halves then load from what is actually installed."
invasiveness = "medium"

[[entry.fixes]]
description = "Check which driver version is installed against the one the running kernel expects."
invasiveness = "inspect"
command = "mhwd -li && uname -r && cat /proc/driver/nvidia/version"
platforms = ["linux"]

[[entry.fixes]]
description = "If the mismatch survives a restart, reinstall the driver against the running kernel using the distribution's own driver manager rather than the vendor installer."
invasiveness = "high"
command = "sudo mhwd -a pci nonfree 0300"
platforms = ["linux"]

[[entry.fixes]]
description = "If the mismatch survives a restart, reinstall the graphics driver, choosing the clean-installation option."
invasiveness = "high"
platforms = ["windows"]

[[entry]]
id = "device.reboot-required"
title = "An update is installed but not yet in use"
finding_ids = ["device.reboot-required"]
explanation = """
Something newer is installed than what is currently running. Nothing is broken, \
but until the machine restarts, newly installed drivers may not match the kernel \
actually in use -- which is how a benign pending reboot turns into the driver \
mismatch above."""

[[entry.fixes]]
description = "Restart the machine when convenient."
invasiveness = "medium"

[[entry]]
id = "device.driver-missing"
title = "A device has no driver"
finding_ids = ["device.driver-missing"]
explanation = """
The system can see this device but has nothing to drive it with, so it is \
present and unusable. This is normal immediately after a fresh installation and \
abnormal on a machine that has been running for a while."""

[[entry.fixes]]
description = "Use the distribution's driver manager to install a matching driver."
invasiveness = "high"
command = "sudo mhwd -a pci free 0300"
platforms = ["linux"]

[[entry.fixes]]
description = "Let Windows Update search for a driver, and if that fails, get one from the hardware vendor directly."
invasiveness = "high"
platforms = ["windows"]

[[entry]]
id = "device.not-working"
title = "A device is present but will not start"
finding_ids = ["device.not-working"]
keywords = ["reported a problem", "43"]
explanation = """
The system tried to start this device and it reported a fault. This particular \
error frequently means genuinely failing hardware rather than a software \
problem, especially if it survives a driver reinstall and a restart."""

[[entry.fixes]]
description = "Restart the machine, which clears transient faults."
invasiveness = "medium"

[[entry.fixes]]
description = "Reseat the device physically if it is a card, and try a different port or slot."
invasiveness = "medium"

[[entry.fixes]]
description = "Reinstall the driver. If the fault returns immediately afterwards, treat the hardware as suspect."
invasiveness = "high"

[[entry]]
id = "service.stopped"
title = "A service that should be running has stopped"
finding_ids = ["service.stopped"]
explanation = """
The service is set to start automatically but stopped with an error, so whatever depends on it is not working. Restarting it is worth trying first: if the cause was transient -- a resource that was briefly unavailable, a race at start-up -- it will simply come back. If it stops again straight away, the cause is not transient and the system log will say what it is."""

[[entry.fixes]]
description = "Restart the service. If it stops again, the cause is not transient and the log will say more."
invasiveness = "low"
action = { kind = "restart-service", target = "{evidence:service}" }

[[entry.fixes]]
description = "Read what the service said when it failed."
invasiveness = "inspect"
command = "systemctl status the-service"
platforms = ["linux"]

[[entry]]
id = "app.launch-failed"
title = "An installed application will not start"
finding_ids = ["app.launch-failed"]
explanation = """
The program is installed but exits with an error instead of starting. The error \
output captured with this finding usually names the cause outright -- most often \
a missing shared library, a permissions problem, or a partially applied update."""

[[entry.fixes]]
description = "Read the captured error output first. A message naming a missing library file identifies the exact package that needs installing."
invasiveness = "inspect"

[[entry.fixes]]
description = "Reinstall the application through the package manager, which repairs a partially applied update."
invasiveness = "medium"

[[entry]]
id = "app.launch-steam-stale-lock"
title = "Steam will not start because a previous session left a lock behind"
finding_ids = ["app.launch-failed", "app.launch-hung"]
keywords = ["steam"]
explanation = """
Steam records the process that owns a session in a small file. If the client was killed, ran out of memory, or the machine lost power, that file is left behind pointing at a process that no longer exists, and the next start refuses to go any further. The file is rebuilt automatically, so removing a stale one costs nothing -- but it must not be removed while Steam is genuinely running, which is why the check that follows a fix starts Steam and watches it."""

[[entry.fixes]]
description = "Remove the leftover session lock. Steam rebuilds it on the next start."
invasiveness = "low"
platforms = ["linux"]
action = { kind = "remove-stale-file", target = "~/.steam/steam.pid" }

[[entry.fixes]]
description = "Remove the leftover process lock in Steam's data directory."
invasiveness = "low"
platforms = ["linux"]
action = { kind = "remove-stale-file", target = "~/.local/share/Steam/.steampid" }

[[entry.fixes]]
description = "Check whether a Steam process is still running and holding the lock."
invasiveness = "inspect"
command = "ps -ef | grep -i steam"
platforms = ["linux"]

[[entry]]
id = "app.launch-missing-library"
title = "An application is missing a shared library"
finding_ids = ["app.launch-failed"]
keywords = ["error while loading shared libraries", "cannot open shared object", "no such file or directory"]
explanation = """
The program cannot start because a library it was built against is not present. \
On a rolling-release distribution this typically follows a system update that \
moved a library to a new version. Applications needing 32-bit libraries are the \
most common casualty, because those come from separate packages that are easy to \
miss."""

[[entry.fixes]]
description = "Identify every unresolved library the program needs."
invasiveness = "inspect"
command = "ldd $(which the-program) | grep 'not found'"
platforms = ["linux"]

[[entry.fixes]]
description = "Find which package provides the missing library and install it."
invasiveness = "medium"
command = "pacman -F the-missing-library.so"
platforms = ["linux"]

[[entry.fixes]]
description = "If the missing libraries are 32-bit, enable the multilib repository and install the lib32 versions."
invasiveness = "medium"
platforms = ["linux"]

[[entry]]
id = "app.launch-hung"
title = "An application hangs instead of starting"
finding_ids = ["app.launch-hung"]
explanation = """
The program started and then stopped doing anything at all -- no processor use, \
no disk activity, no output. That pattern means it is waiting for something that \
is not coming: a service that is not running, a network resource, or a lock file \
left behind by a previous crash."""

[[entry.fixes]]
description = "Check whether a previous run left a lock file behind, and remove it if the process that owned it is gone."
invasiveness = "low"

[[entry.fixes]]
description = "Check whether any service the program depends on is actually running."
invasiveness = "inspect"
command = "systemctl --failed"
platforms = ["linux"]

[[entry.fixes]]
description = "Start the program from a terminal, which often reveals what it is waiting on."
invasiveness = "inspect"

[[entry]]
id = "logs.unexpected-shutdown"
title = "The machine shut down without warning"
finding_ids = ["logs.unexpected-shutdown"]
explanation = """
The system stopped without shutting down cleanly. From the log's point of view a \
freeze, a hard lock-up, and a blue screen all look the same. A single occurrence \
may be a power cut; a pattern of them points at a driver conflict, failing \
memory, an overheating component, or an unstable power supply -- not at whatever \
program happened to be on screen."""

[[entry.fixes]]
description = "Check what changed shortly before the first occurrence, particularly driver and kernel updates."
invasiveness = "inspect"

[[entry.fixes]]
description = "Check component temperatures under load. Thermal shutdowns look exactly like this."
invasiveness = "inspect"
command = "sensors"
platforms = ["linux"]

[[entry.fixes]]
description = "Remove any overclock or undervolt, including memory timing profiles, and see whether stability returns."
invasiveness = "medium"

[[entry.fixes]]
description = "Test memory thoroughly. Faulty memory produces exactly this pattern of unpredictable, unexplained failures."
invasiveness = "medium"

[[entry]]
id = "logs.bugcheck"
title = "The system crashed with a blue screen"
finding_ids = ["logs.bugcheck"]
explanation = """
Windows recorded a bug check. The stop code in the captured message identifies \
which component failed, and it is far more often a driver than the hardware that \
driver controls."""

[[entry.fixes]]
description = "Note the stop code and the faulting module from the captured message, then check whether that driver changed recently."
invasiveness = "inspect"

[[entry.fixes]]
description = "Roll back or reinstall the driver named in the stop code."
invasiveness = "high"

[[entry]]
id = "logs.hardware-error"
title = "The processor reported a hardware error"
finding_ids = ["logs.hardware-error"]
explanation = """
This came from the processor's own error reporting rather than from software \
interpreting a symptom, which makes it one of the strongest signals available \
that a component is genuinely failing or is unstable at its current settings. \
Treat it as a hardware problem until proven otherwise."""

[[entry.fixes]]
description = "Remove every overclock and undervolt, including memory profiles, and return the machine to stock settings."
invasiveness = "medium"

[[entry.fixes]]
description = "Verify cooling and power delivery -- fan operation, dust, and that the power supply is adequate."
invasiveness = "inspect"

[[entry.fixes]]
description = "Test memory and the processor individually to find which component is at fault."
invasiveness = "medium"

[[entry]]
id = "logs.display-driver-timeout"
title = "The graphics driver stopped responding"
finding_ids = ["logs.display-driver-timeout", "logs.gpu-fault"]
explanation = """
The display driver stopped responding for long enough that the system reset it. \
Users see this as the screen going black briefly, a game crashing to the desktop, \
or a full freeze. It is usually a driver version problem, an unstable GPU \
overclock, or insufficient power delivery -- and it is one of the clearest signs \
of a driver and system that do not match."""

[[entry.fixes]]
description = "Check the installed driver version and when it last changed."
invasiveness = "inspect"
command = "nvidia-smi --query-gpu=driver_version --format=csv,noheader"

[[entry.fixes]]
description = "Remove any GPU overclock or undervolt, including memory clocks, and retest."
invasiveness = "low"

[[entry.fixes]]
description = "Install the driver version the distribution recommends for this card rather than the newest available one."
invasiveness = "high"
platforms = ["linux"]
command = "sudo mhwd -a pci nonfree 0300"

[[entry]]
id = "logs.kernel-panic"
title = "The kernel crashed"
finding_ids = ["logs.kernel-panic"]
explanation = """
The kernel hit a fault it could not recover from, and the machine either froze or \
rebooted at that moment. The module named in the captured message is where to \
start, and a kernel or driver update shortly beforehand is the most common cause."""

[[entry.fixes]]
description = "Identify the module named in the captured message, and check when it or the kernel last changed."
invasiveness = "inspect"

[[entry.fixes]]
description = "Boot the previous kernel from the boot menu. If the machine is stable on it, the new kernel or its drivers are the cause."
invasiveness = "medium"
platforms = ["linux"]

[[entry]]
id = "logs.oom-kill"
title = "The system ran out of memory and killed a program"
finding_ids = ["logs.oom-kill"]
explanation = """
The kernel ran out of usable memory and terminated a process to stay alive. The \
program it killed is usually the largest one running rather than the one at \
fault, which is why this so often looks like an unrelated application crashing at \
random."""

[[entry.fixes]]
description = "Identify what consumed the memory rather than what was killed -- they are usually different programs."
invasiveness = "inspect"

[[entry.fixes]]
description = "Add or enlarge swap so the kernel has somewhere to fall back to instead of killing processes."
invasiveness = "medium"
platforms = ["linux"]

[[entry]]
id = "logs.storage-error"
title = "A drive reported read or write errors"
finding_ids = ["logs.storage-error"]
explanation = """
The storage layer reported errors reaching a drive. Unlike most log noise, this \
one predicts data loss: drives that report I/O errors frequently go on to fail \
outright. Treat the backup as the urgent step and the diagnosis as the second \
one."""

[[entry.fixes]]
description = "Back up anything irreplaceable from this drive now, before any further investigation."
invasiveness = "inspect"

[[entry.fixes]]
description = "Read the drive's own health data, which reports reallocated sectors and pending failures."
invasiveness = "inspect"
command = "smartctl -a /dev/sda"

[[entry.fixes]]
description = "Check the cable and port before condemning the drive -- a failing cable produces identical errors."
invasiveness = "medium"

# A general fallback for a device that will not start. The entry above is more
# specific -- it additionally requires the "reported a problem" wording -- and
# wins when it matches, because that particular error means something stronger.
[[entry]]
id = "device.not-working-general"
title = "A device will not start"
finding_ids = ["device.not-working"]
explanation = """
The system can see this device but cannot bring it into service. The code \
recorded with the finding narrows it down: a resource conflict, a driver that \
will not load, or a device that is failing."""

[[entry.fixes]]
description = "Restart the machine, which clears transient resource conflicts."
invasiveness = "medium"

[[entry.fixes]]
description = "Check whether this device worked before a recent update."
invasiveness = "inspect"

[[entry.fixes]]
description = "Reinstall or roll back the driver for this device."
invasiveness = "high"

[[entry]]
id = "storage.drive-failing"
title = "A drive says it is failing"
finding_ids = ["storage.drive-failing"]
keywords = ["smart", "failing", "disk", "drive"]
explanation = """
This is the drive's own assessment of itself, not a guess made from the outside. \
Its firmware tracks reallocated sectors, failed writes, and error rates against \
thresholds the manufacturer set, and it has decided it is no longer reliable. \
Drives that reach this point sometimes run for months and sometimes stop the same \
day; there is no way to tell which from here.

Two things follow from that. Get the data off first -- before diagnosing, before \
repairing, before anything. And do not run a surface scan or a repair tool on it \
in the meantime: those read the whole disk hard, which is exactly the load most \
likely to finish it off, and they cannot fix a drive that has already exhausted its \
spare sectors."""

[[entry.fixes]]
description = "Copy anything you care about off this drive now. A backup taken from a failing drive is worth more than any diagnosis of it."
invasiveness = "inspect"

[[entry.fixes]]
description = "Once the data is safe, look at the drive's full report to see how far along it is."
invasiveness = "inspect"
command = "smartctl -a /dev/sda"
platforms = ["linux"]

[[entry.fixes]]
description = "Once the data is safe, look at the drive's reliability counters. This needs an administrator terminal."
invasiveness = "inspect"
command = "Get-PhysicalDisk | Get-StorageReliabilityCounter"
platforms = ["windows"]

[[entry.fixes]]
description = "Replace the drive. A drive that has failed its own self-assessment does not recover, and nothing you run on it will change that."
invasiveness = "high"

[[entry]]
id = "storage.drive-warning"
title = "A drive is reporting a problem"
finding_ids = ["storage.drive-warning"]
keywords = ["smart", "disk", "drive", "warning"]
explanation = """
The drive has not declared itself failing, but something is wrong enough for it to \
say so. This covers two quite different situations, and the details on the finding \
say which.

A drive reporting a fault it then recovers from is common -- a cable that is not \
seated properly, a controller that reset, a power interruption during a write. A \
drive reporting a fault that gets worse between scans is the early part of the \
previous entry. The way to tell them apart is to look again in a few days, which \
is why the first thing to do is make sure you have a backup and the second is to \
note where it is now."""

[[entry.fixes]]
description = "Make sure you have a current backup of this drive before investigating anything."
invasiveness = "inspect"

[[entry.fixes]]
description = "Check the cabling and the power connection. A drive reported as healthy but unusable is very often a connection rather than the drive."
invasiveness = "inspect"

[[entry.fixes]]
description = "Note the reallocated-sector and error counts on the finding, then scan again in a few days. A number that has not moved is a different problem from one that has."
invasiveness = "inspect"

# --- What starts with the machine -------------------------------------------
#
# These five come from the start-up check. Read `docs/startup.md` before
# changing the wording of any of them: the difference between "this is where
# something hiding would put itself" and "you have something hiding" is the
# whole reason that check is careful, and a runbook is exactly where that care
# gets thrown away.

[[entry]]
id = "startup.encoded-command"
title = "A start-up entry runs a command written so it cannot be read"
finding_ids = ["startup.encoded-command"]
explanation = """
Something arranged to run at every start-up, and the command it runs is \
encoded rather than written out. The encoding is not encryption and hides \
nothing from a determined reader -- but it does hide the command from the \
person scrolling the list, which is the only reason to use it there.

Installers and management software do occasionally do this, so it is not proof \
of anything on its own. What can be said is narrower and worth saying plainly: \
of everything that starts with this machine, this is the entry whose purpose \
cannot be read at a glance, and that is worth two minutes of your attention \
rather than none.

Decode it before deciding anything. The encoded text is base64; decoding it \
changes nothing on the machine and tells you what the command actually is. If \
what comes out is something you recognise, the matter is closed."""

[[entry.fixes]]
description = "Decode the command and read it. It only prints the text -- it runs nothing."
invasiveness = "inspect"

[[entry.fixes]]
description = "If you do not recognise what it does, look up the program it runs before removing anything. Removing a start-up entry that something depends on is easy to undo; acting on a guess about what it was is not."
invasiveness = "inspect"

[[entry]]
id = "startup.temporary-location"
title = "A start-up entry runs a program from a temporary folder"
finding_ids = ["startup.temporary-location"]
explanation = """
Something starts with the machine from a temporary folder, a downloads folder, \
or a browser cache. Those places are for files on their way somewhere else. A \
program that arranged to be started from one of them either was installed \
carelessly, or was never installed at all and is running from where it landed.

Installers that ask to run at start-up before they have finished installing do \
this, and so does the other thing. Neither is confirmed by the location \
alone."""

[[entry.fixes]]
description = "Look at the program named in the evidence below. If it belongs to something you installed and the installation finished, the entry is stale rather than sinister."
invasiveness = "inspect"

[[entry.fixes]]
description = "If you do not recognise it, look the file up before deleting it, and prefer removing the start-up entry to deleting the file -- the entry can be put back."
invasiveness = "inspect"

[[entry]]
id = "startup.points-at-nothing"
title = "A start-up entry names a program that is not there"
finding_ids = ["startup.points-at-nothing"]
explanation = """
The machine is asked to run these every time it starts, and the file each one \
names is not on the disk. Nothing is broken by them: the operating system \
tries, fails, and carries on. Almost always this is what an uninstaller left \
behind when it removed the program but not the instruction to start it.

They are clutter rather than a fault, and their real cost is to the list they \
are in -- a start-up list with eleven dead entries in it is a list nobody \
reads, which is the condition under which something worth noticing goes \
unnoticed."""

[[entry.fixes]]
description = "Safe to remove: there is nothing behind them to break. Windows: Task Manager, Start-up apps tab, or the Start-up folder itself. Linux: the .desktop file in ~/.config/autostart."
invasiveness = "low"

[[entry.fixes]]
description = "Check first that you did not want the program. This says it is gone, not that it is switched off -- so if you still want it, reinstalling it is the fix here, not removing the entry."
invasiveness = "inspect"

[[entry]]
id = "startup.library-preload"
title = "Every program on this machine is told to load an extra library first"
finding_ids = ["startup.library-preload"]
explanation = """
A system-wide preload is set, which means every program that starts is told to \
load this library before its own code. That is a legitimate mechanism -- \
debuggers, compatibility shims, and some audio and graphics tools use it -- and \
it is also the most direct way to make code run inside every program on a \
machine without modifying any of them.

Which of those it is depends entirely on what the library is, so that is the \
question to answer. It is one file, and it is named below."""

[[entry.fixes]]
description = "Find out what the library is and what installed it. On Linux the setting lives in /etc/ld.so.preload and in the LD_PRELOAD environment variable; listing the file and asking the package manager which package owns it answers most cases."
invasiveness = "inspect"

[[entry.fixes]]
description = "If nothing owns it and you did not put it there, that is worth pursuing properly rather than by deleting the file. A machine where this is malicious is a machine whose own tools are worth doubting, and the reliable answer is to check it from something that is not it."
invasiveness = "inspect"

[[entry]]
id = "startup.crowded"
title = "A great many things start with the machine"
finding_ids = ["startup.crowded"]
explanation = """
Each of these is asked to start before the machine is usable, so they compete \
for the disk and the processor at exactly the moment there is least of both to \
go round. This is the usual answer to a computer that is slow for its first \
two minutes and fine afterwards.

Nothing here is wrong. A long list is a long list, and most of it is probably \
software you chose. It is worth reading once, because almost nobody has ever \
read theirs."""

[[entry.fixes]]
description = "Read the list and turn off the ones you do not need running before you have asked for them. Updaters, launchers, and printer utilities are the usual candidates; most will start themselves when you actually open the program."
invasiveness = "low"

[[entry.fixes]]
description = "Turn them off rather than uninstalling them, and do it a few at a time. Disabling a start-up entry is immediately reversible and tells you what it was doing for you."
invasiveness = "low"

# --- System file integrity ---------------------------------------------------

[[entry]]
id = "system.files-altered"
title = "System files no longer match their packages"
finding_ids = ["system.files-altered"]
explanation = """
Files belonging to the operating system are not the files that were installed. \
There are four ordinary explanations and one that is not: an update that did \
not finish, a disk that corrupted a file it was holding, a program that \
overwrote a shared library with its own copy, a file you edited yourself -- or \
something that replaced a system file deliberately.

The check cannot tell those apart, and neither can anything else that runs on \
this machine. What it can do is give you the list, which is the part that takes \
a computer hours and a person minutes. Read it first: your own edits are \
usually obvious to you and to nobody else, and every one you recognise is one \
fewer thing to explain."""

[[entry.fixes]]
description = "Go through the list and mark off anything you changed yourself. Configuration under /etc, hosts files, and anything you remember editing all count as altered here."
invasiveness = "inspect"

[[entry.fixes]]
description = "Repair the rest by reinstalling the package that owns each file, rather than by replacing files individually."
invasiveness = "medium"

[[entry.fixes]]
description = "Windows: run the repairing version of the same check this tool ran, from an administrator prompt. If it cannot fix them, repair the store it draws replacements from and run it again."
invasiveness = "medium"
command = "sfc /scannow"
platforms = ["windows"]

[[entry.fixes]]
description = "Linux: find the owning package, then reinstall it. Use pacman -Qo then pacman -S on Arch, rpm -qf then dnf reinstall on Fedora, dpkg -S then apt install --reinstall on Debian."
invasiveness = "medium"
platforms = ["linux"]

[[entry]]
id = "system.config-altered"
title = "Configuration files differ from the packaged versions"
finding_ids = ["system.config-altered"]
explanation = """
These are the files the packaging system marks as yours to edit, and they have \
been edited. That is what they are for, and this is listed separately from the \
altered system files for exactly that reason: on most machines it is a record \
of decisions somebody made on purpose, not a problem.

It is worth a read when something started misbehaving after an update, because \
a package update leaves your version of a configuration file in place and puts \
its new version alongside it. A setting that stopped working is often a setting \
that moved."""

[[entry.fixes]]
description = "Nothing to do unless something is actually wrong. If it is, compare each file against the packaged version to see what your machine does differently."
invasiveness = "inspect"

[[entry.fixes]]
description = "After an update, look for files left beside these ones with a .pacnew, .rpmnew, or .dpkg-dist suffix. Those are the new defaults, waiting for somebody to merge them."
invasiveness = "inspect"
platforms = ["linux"]

[[entry]]
id = "system.files-unverified"
title = "System files could not be verified"
finding_ids = ["system.files-unverified"]
explanation = """
The integrity check did not run, so nothing is known about the operating \
system's own files -- which is not the same as knowing they are fine, and is \
reported rather than passed over for that reason. This is most of what a deep \
scan does that a full scan does not, and a deep scan that quietly skipped it \
would read exactly like one that ran it and found nothing wrong.

The usual causes are ordinary. Windows needs the scan to be run as an \
administrator. Linux needs the distribution's package manager to be one this \
tool knows how to ask, and some do not offer the question at all."""

[[entry.fixes]]
description = "Windows: run the deep scan again from a terminal opened as administrator. Verifying system files means reading files that are not readable otherwise."
invasiveness = "inspect"
platforms = ["windows"]

[[entry.fixes]]
description = "Linux: check whether your package manager can verify installed files at all. Arch, Fedora, and Debian each offer it under a different name, and if yours is not one of them the check has nothing to ask."
invasiveness = "inspect"
platforms = ["linux"]

[[entry.fixes]]
description = "If you asked for a deep scan because you suspect the machine has been tampered with, this is the check you wanted, and it is worth getting it to run. A machine that cannot verify itself is also the machine you would least want to take the answer from -- checking its disk from another system is the stronger version of this."
invasiveness = "inspect"
