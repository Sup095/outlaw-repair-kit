[package]
name = "ork-link"
description = "Securely linking two machines so one can lend the other a model."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ork-core.workspace = true
ork-fix.workspace = true

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
tracing.workspace = true
reqwest.workspace = true
time.workspace = true

axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
hmac = "0.12"
sha2 = "0.10"
rand = "0.9"
subtle = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3"

# The credential store, same as everywhere else in this project: an access
# token belongs in the operating system's own keeping, not in a file.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
