[package]
name = "ork-setup"
description = "Graphical installer for the Outlaw Repair Kit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "outlaw-setup"
path = "src/main.rs"

[dependencies]
ork-core.workspace = true
ork-ai.workspace = true

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# Blocking, because this program has no async runtime and no reason for one:
# it does a handful of downloads in a worker thread and reports progress.
reqwest = { workspace = true, features = ["blocking"] }
sha2 = "0.10"
dirs.workspace = true
tracing.workspace = true

# Not Tauri, and not by accident.
#
# An installer is the one program that cannot have prerequisites. Tauri draws
# into a system webview: WebView2 on Windows, webkit2gtk on Linux. Either can
# be missing on exactly the machine somebody is trying to set up, which would
# make this an installer that needs installing. `eframe` carries its own
# drawing and needs nothing but a graphics driver.
#
# Both drawing backends are compiled in, and `main` tries them in order. wgpu
# was originally left out to keep the download small; it is here because the
# OpenGL path renders a blank white window on an ordinary Windows desktop with
# a current NVIDIA card, where overlay software hooks the buffer swap and the
# frames never reach the screen. See the note on `main`. OpenGL stays as the
# fallback for machines with no Direct3D 12, Vulkan, or GLES.
eframe = { version = "0.32", default-features = false, features = [
    "glow",
    "wgpu",
    "default_fonts",
    "wayland",
    "x11",
] }

# eframe's `wgpu` feature brings the crate in but selects no backend, and wgpu
# panics at start-up if none is enabled. Named here so the choice is visible:
# Direct3D 12 and Vulkan cover current Windows and Linux, and GLES is the last
# resort before falling back to the OpenGL renderer outright.
wgpu = { version = "25", default-features = false, features = [
    "dx12",
    "vulkan",
    "gles",
] }
