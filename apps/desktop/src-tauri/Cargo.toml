[package]
name = "ork-desktop"
description = "Desktop front-end for the Outlaw Repair Kit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# Deliberately not `ork_desktop`. The binary target is `ork-desktop`, which
# Cargo normalises to the same file stem, and the two then fight over
# `ork_desktop.pdb` in the target directory -- a warning on every build, and
# one target's debug symbols quietly overwriting the other's. Tauri's own
# template renames the library for this exact reason.
name = "ork_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ork-core.workspace = true
ork-ai.workspace = true
ork-fix.workspace = true
ork-link.workspace = true
ork-boot.workspace = true

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# Only the window renders the manual, so the Markdown renderer is a
# dependency of the window and not of the shared crates. The command line
# prints the same pages as the Markdown they are written in.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
tauri = { version = "2", features = [] }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
